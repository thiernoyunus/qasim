name: Wick
options:
  bundleIdPrefix: computer.wick
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Wick:
    type: application
    platform: macOS
    sources:
      - path: Wick
        excludes:
          - "**/.DS_Store"
    info:
      path: Wick/Info.plist
      properties:
        CFBundleDisplayName: Wick
        CFBundleName: Wick
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: Wick checks Safari and Chrome so it knows whether you wandered off to a blocked site.
        NSLocationUsageDescription: Wick uses your location to look up prayer times for where you are. You can pick a city instead.
        NSLocationWhenInUseUsageDescription: Wick uses your location to look up prayer times for where you are. You can pick a city instead.
        SUFeedURL: https://raw.githubusercontent.com/thiernoyunus/wick-updates/main/appcast.xml
        SUPublicEDKey: aB4rEMOSEkFUkwmDr7e4VIzlXDezIZi6pVsXQqm8uHo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Wick/Wick.entitlements
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.wick.app
        PRODUCT_NAME: Wick
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7756PBXM2X
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Wick/Info.plist
    scheme:
      gatherCoverageData: false
