name: Qasim
options:
  bundleIdPrefix: computer.qasim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Qasim:
    type: application
    platform: macOS
    sources:
      - path: Qasim
        excludes:
          - "**/.DS_Store"
    info:
      path: Qasim/Info.plist
      properties:
        CFBundleDisplayName: Qasim
        CFBundleName: Qasim
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: Qasim checks Safari and Chrome so it knows whether you wandered off to a blocked site.
        NSLocationUsageDescription: Qasim uses your location to look up prayer times for where you are. You can pick a city instead.
        NSLocationWhenInUseUsageDescription: Qasim uses your location to look up prayer times for where you are. You can pick a city instead.
        SUFeedURL: https://raw.githubusercontent.com/thiernoyunus/qasim-updates/main/appcast.xml
        SUPublicEDKey: aB4rEMOSEkFUkwmDr7e4VIzlXDezIZi6pVsXQqm8uHo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Qasim/Qasim.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.qasim.app
        PRODUCT_NAME: Qasim
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7756PBXM2X
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Qasim/Info.plist
    scheme:
      gatherCoverageData: false
